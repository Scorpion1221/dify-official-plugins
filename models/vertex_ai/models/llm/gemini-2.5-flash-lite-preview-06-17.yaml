model: gemini-2.5-flash-lite-preview-06-17
label:
  en_US: Gemini 2.5 Flash Lite Preview 06-17
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - document
  - video
  - audio
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: thinking_mode
    label:
      zh_Hans: 推理模式
      en_US: Thinking Mode
    type: boolean
    default: true
    required: true
    help:
      zh_Hans: 控制模型的推理模式。
      en_US: Controls the model's thinking mode.
  - name: thinking_summary
    label:
      zh_Hans: 思考摘要
      en_US: Thinking Summary
    type: boolean
    default: false
    required: false
    help:
      zh_Hans: 控制模型的推理摘要是否展示。
      en_US: Controls the model's thinking summary display.
  - name: thinking_budget
    label:
      zh_Hans: 推理预算
      en_US: Thinking Budget
    type: int
    default: 1024
    min: 0
    max: 24576
    required: false
    help:
      zh_Hans: 推理的预算限制（0是停用内部思考），必须小于max_tokens。
      en_US: Budget limit for thinking (disable thinking is dynamic thinking, enable thinking is custom budget, 0 is disable internal thinking), must be less than max_tokens.
  - name: temperature
    use_template: temperature
    default: 0.7
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
  - name: top_k
    label:
      zh_Hans: 取样数量
      en_US: Top k
    type: int
    help:
      zh_Hans: 仅从每个后续标记的前 K 个选项中采样。
      en_US: Only sample from the top K options for each subsequent token.
    required: false
  - name: max_output_tokens
    use_template: max_tokens
    default: 65535
    min: 1
    max: 65535
  - name: code_execution
    label:
      en_US: Code Execution
      zh_Hans: 代码执行
      ja_JP: コード実行
    type: boolean
    help:
      en_US: Enable Python code execution for calculations and data analysis
      zh_Hans: 启用 Python 代码执行功能，用于计算和数据分析
      ja_JP: 計算とデータ分析のためのPythonコード実行を有効にします
    required: false
    default: false
  - name: json_schema
    use_template: json_schema
  - name: grounding
    label:
      en_US: Grounding
    type: float
    help:
      en_US: ensures responses are based on reliable sources.
    required: false
    min: 0
    max: 1
pricing:
  input: '0.10'
  output: '0.40'
  unit: '0.000001'
  currency: USD
