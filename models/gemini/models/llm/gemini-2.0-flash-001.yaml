model: gemini-2.0-flash-001
label:
  en_US: Gemini 2.0 Flash 001
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - document
  - video
  - audio
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
  - name: top_k
    label:
      zh_Hans: 取样数量
      en_US: Top k
    type: int
    help:
      zh_Hans: 仅从每个后续标记的前 K 个选项中采样。
      en_US: Only sample from the top K options for each subsequent token.
    required: false
  - name: max_output_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 8192
  - name: code_execution
    label:
      en_US: Code Execution
      zh_Hans: 代码执行
      ja_JP: コード実行
    type: boolean
    help:
      en_US: Enable Python code execution for calculations and data analysis
      zh_Hans: 启用 Python 代码执行功能，用于计算和数据分析
      ja_JP: 計算とデータ分析のためのPythonコード実行を有効にします
    required: false
    default: false
  - name: code_execution_output
    label:
      zh_Hans: 代码执行输出
      en_US: Code Execution Output
    type: boolean
    default: false
    required: false
    help:
      zh_Hans: 控制代码执行结果是否展示。
      en_US: Controls the code execution output display.
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.00'
  output: '0.00'
  unit: '0.000001'
  currency: USD
